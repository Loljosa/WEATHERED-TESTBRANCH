<svg xmlns="http://www.w3.org/2000/svg" width="380" height="346" viewBox="0 0 380 346" role="img" aria-labelledby="title desc">
<title id="title">From clear air to a cloud</title>
<desc id="desc">Warm moist air moves through buoyancy and transport, reaches saturation and forms cloud water shown by debug voxels.</desc>
<rect x="1" y="1" width="378" height="344" rx="20" fill="#0b1720" stroke="#29404c"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="18" y="29" font-size="10" fill="#9bd8be" font-weight="bold" letter-spacing="0.5">CLOUD WATER COMES FROM THE MODEL</text>
<rect x="18" y="48" width="164" height="128" rx="10" fill="#11232d"/>
<text x="31" y="74" font-size="12" fill="#e8c882" font-weight="bold" >01</text>
<text x="31" y="102" font-size="13" fill="#edf5ef" font-weight="bold" >WARM + MOIST</text>
<text x="31" y="130" font-size="10" fill="#afc3ca" >Initialize theta and vapor</text>
<text x="31" y="149" font-size="10" fill="#afc3ca" >Cloud water begins at zero</text>
<rect x="198" y="48" width="164" height="128" rx="10" fill="#11232d"/>
<text x="211" y="74" font-size="12" fill="#87bbd2" font-weight="bold" >02</text>
<text x="211" y="102" font-size="13" fill="#edf5ef" font-weight="bold" >RISE + MOVE</text>
<text x="211" y="130" font-size="10" fill="#afc3ca" >Buoyancy and transport</text>
<text x="211" y="149" font-size="10" fill="#afc3ca" >Wind carries the source</text>
<rect x="18" y="192" width="164" height="128" rx="10" fill="#11232d"/>
<text x="31" y="218" font-size="12" fill="#9bd8be" font-weight="bold" >03</text>
<text x="31" y="246" font-size="13" fill="#edf5ef" font-weight="bold" >SATURATION</text>
<text x="31" y="274" font-size="10" fill="#afc3ca" >Convert vapor into qc</text>
<text x="31" y="293" font-size="10" fill="#afc3ca" >Account for latent heat</text>
<rect x="198" y="192" width="164" height="128" rx="10" fill="#11232d"/>
<text x="211" y="218" font-size="12" fill="#9bd8be" font-weight="bold" >04</text>
<text x="211" y="246" font-size="13" fill="#edf5ef" font-weight="bold" >SHOW THE FIELD</text>
<text x="211" y="274" font-size="10" fill="#afc3ca" >Render cells containing qc</text>
<text x="211" y="293" font-size="10" fill="#afc3ca" >Cloud shape evolves</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="178" viewBox="0 0 1000 178" role="img" aria-labelledby="title desc">
<title id="title">WEATHERED engine at a glance</title>
<desc id="desc">Version 0.2.4-alpha, fixed timestep 0.25 seconds, default Laptop grid of 3072 cells, diagnostic voxels 12 studs wide.</desc>
<rect x="1" y="1" width="998" height="176" rx="20" fill="#0b1720" stroke="#29404c"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="28" font-size="11" fill="#9bd8be" font-weight="bold" letter-spacing="1.5">CURRENT ENGINE · PHASE 2</text>
<rect x="24" y="44" width="226" height="100" rx="12" fill="#11232d"/>
<text x="40" y="67" font-size="10" fill="#afc3ca" font-weight="bold" letter-spacing="1">ENGINE</text>
<text x="40" y="101" font-size="29" fill="#e8c882" font-weight="bold" >0.2.4-alpha</text>
<text x="40" y="124" font-size="12" fill="#afc3ca" >3D atmospheric dynamics</text>
<rect x="266" y="44" width="226" height="100" rx="12" fill="#11232d"/>
<text x="282" y="67" font-size="10" fill="#afc3ca" font-weight="bold" letter-spacing="1">FIXED STEP</text>
<text x="282" y="101" font-size="32" fill="#edf5ef" font-weight="bold" >0.25 s</text>
<text x="282" y="124" font-size="12" fill="#afc3ca" >Independent of frame duration</text>
<rect x="508" y="44" width="226" height="100" rx="12" fill="#11232d"/>
<text x="524" y="67" font-size="10" fill="#afc3ca" font-weight="bold" letter-spacing="1">LAPTOP GRID</text>
<text x="524" y="101" font-size="32" fill="#edf5ef" font-weight="bold" >3,072</text>
<text x="524" y="124" font-size="12" fill="#afc3ca" >Packed simulation cells</text>
<rect x="750" y="44" width="226" height="100" rx="12" fill="#11232d"/>
<text x="766" y="67" font-size="10" fill="#afc3ca" font-weight="bold" letter-spacing="1">DEBUG VOXEL</text>
<text x="766" y="101" font-size="32" fill="#edf5ef" font-weight="bold" >12 studs</text>
<text x="766" y="124" font-size="12" fill="#afc3ca" >Cloud-water visualization</text>
<text x="24" y="162" font-size="11" fill="#afc3ca" >Physics in meters · Display in studs · Field-driven debug visuals</text>
</g>
</svg>

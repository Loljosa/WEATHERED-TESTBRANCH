<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="194" viewBox="0 0 1000 194" role="img" aria-labelledby="title desc">
<title id="title">From clear air to a cloud</title>
<desc id="desc">A warm and moist source develops through buoyancy and three-dimensional transport. Saturation converts vapor to cloud water, shown by debug voxels.</desc>
<rect x="1" y="1" width="998" height="192" rx="20" fill="#0b1720" stroke="#29404c"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="24" y="29" font-size="11" fill="#9bd8be" font-weight="bold" letter-spacing="1.5">CLOUD WATER COMES FROM THE MODEL</text>
<rect x="24" y="48" width="226" height="126" rx="12" fill="#11232d"/>
<text x="40" y="75" font-size="12" fill="#e8c882" font-weight="bold" >01</text>
<text x="40" y="103" font-size="14" fill="#edf5ef" font-weight="bold" >WARM + MOIST</text>
<text x="40" y="131" font-size="12" fill="#afc3ca" >Initialize theta and vapor</text>
<text x="40" y="150" font-size="12" fill="#afc3ca" >Cloud water begins at zero</text>
<path d="M254 105 l7 5 l-7 5" fill="none" stroke="#9bd8be" stroke-width="2"/>
<rect x="266" y="48" width="226" height="126" rx="12" fill="#11232d"/>
<text x="282" y="75" font-size="12" fill="#87bbd2" font-weight="bold" >02</text>
<text x="282" y="103" font-size="14" fill="#edf5ef" font-weight="bold" >RISE + MOVE</text>
<text x="282" y="131" font-size="12" fill="#afc3ca" >Buoyancy and 3D transport</text>
<text x="282" y="150" font-size="12" fill="#afc3ca" >Wind carries the source</text>
<path d="M496 105 l7 5 l-7 5" fill="none" stroke="#9bd8be" stroke-width="2"/>
<rect x="508" y="48" width="226" height="126" rx="12" fill="#11232d"/>
<text x="524" y="75" font-size="12" fill="#9bd8be" font-weight="bold" >03</text>
<text x="524" y="103" font-size="14" fill="#edf5ef" font-weight="bold" >REACH SATURATION</text>
<text x="524" y="131" font-size="12" fill="#afc3ca" >Convert vapor into cloud water</text>
<text x="524" y="150" font-size="12" fill="#afc3ca" >Account for latent heat</text>
<path d="M738 105 l7 5 l-7 5" fill="none" stroke="#9bd8be" stroke-width="2"/>
<rect x="750" y="48" width="226" height="126" rx="12" fill="#11232d"/>
<text x="766" y="75" font-size="12" fill="#9bd8be" font-weight="bold" >04</text>
<text x="766" y="103" font-size="14" fill="#edf5ef" font-weight="bold" >SHOW THE FIELD</text>
<text x="766" y="131" font-size="12" fill="#afc3ca" >Render cells containing qc</text>
<text x="766" y="150" font-size="12" fill="#afc3ca" >Cloud shape evolves</text>
</g>
</svg>
